<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box-Sizing Comparison</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Box-Sizing Comparison</h1>
    <div class="boxes">
      <div class="box default-box">
        <h2>Default (content-box)</h2>
        <p>The width does not include padding or border, so the box appears larger.</p>
      </div>
      <div class="box border-box">
        <h2>Border-Box</h2>
        <p>The width includes padding and border, keeping the total size consistent.</p>
      </div>
    </div>
  </div>
</body>
</html>

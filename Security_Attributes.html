<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Security Example</title>
</head>
<body>
    <h1>Secure Login Form</h1>
    
    
    <form action="#" method="post" autocomplete="off">
        
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required><br><br>
        
        
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>
        
       
        <input type="submit" value="Login">
    </form>
    
    
    <p>
        <strong>Note:</strong> Turning off autocomplete can improve security because the browser will not store or suggest previously entered sensitive information like usernames and passwords. This helps prevent unauthorized access if someone else uses the same device.
    </p>
</body>
</html>

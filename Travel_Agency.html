<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Agency Showcase</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container my-4">

        <h2 class="text-center mb-4 fw-bold">Explore Beautiful Destinations</h2>

        <div id="travelCarousel" class="carousel slide mb-4" data-bs-ride="carousel">

            <div class="carousel-inner">

                <div class="carousel-item active" data-bs-interval="2000">
                    <img src="https://via.placeholder.com/900x400?text=Paris" class="d-block w-100" alt="Paris">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>Paris, France</h5>
                        <p>The city of lights and romance.</p>
                    </div>
                </div>

                <div class="carousel-item" data-bs-interval="2500">
                    <img src="https://via.placeholder.com/900x400?text=Bali" class="d-block w-100" alt="Bali">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>Bali, Indonesia</h5>
                        <p>Tropical beaches and serene landscapes.</p>
                    </div>
                </div>

                <div class="carousel-item" data-bs-interval="3000">
                    <img src="https://via.placeholder.com/900x400?text=New+York" class="d-block w-100" alt="New York">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>New York, USA</h5>
                        <p>The city that never sleeps.</p>
                    </div>
                </div>

            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#travelCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>

            <button class="carousel-control-next" type="button" data-bs-target="#travelCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>

        <h5 class="mb-2 fw-bold">Booking Progress</h5>
        <div class="progress mb-4">
            <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width: 70%;">
                70%
            </div>
        </div>

    </div>

    <footer class="text-center py-3 bg-dark text-white">
        <p class="mb-0">Contact: travel@agency.com | +91 98765 43210</p>
        <p class="mb-0">© 2025 Travel Agency. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

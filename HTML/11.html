<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Span Example</title>
    <style>
        .html { color: red; font-weight: bold; }
        .css { color: blue; font-style: italic; }
        .js { color: green; text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Web Development Technologies</h1>

    <p>
        <span class="html">HTML</span> structures the content, 
        <span class="css">CSS</span> styles the page, and 
        <span class="js">JavaScript</span> adds interactivity.
    </p>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form with Iframe Result</title>
</head>
<body>
    <h1>Submit the Form</h1>
    
    
    <form action="result.html" method="get" target="resultFrame">
        <label for="username">Enter your name:</label><br>
        <input type="text" id="username" name="username" required><br><br>
        <input type="submit" value="Submit">
    </form>
    
    <h2>Result:</h2>
    
    <iframe name="resultFrame" width="100%" height="100" style="border:1px solid #333;"></iframe>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSS Selectors Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Advanced CSS Selectors Demonstration</h1>

    <div class="form-section">
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter your name">
        <button>Submit</button>
    </div>

    <div class="link-section">
        <h2>Useful Links</h2>
        <ul>
            <li><a href="https://example.com">Secure Link</a></li>
            <li><a href="http://example.org">Regular Link</a></li>
            <li><a href="https://openai.com">OpenAI Link</a></li>
        </ul>
    </div>

    <div class="list-section">
        <h2>Item List</h2>
        <ul class="item-list">
            <li>First Item</li>
            <li>Second Item</li>
            <li>Third Item</li>
            <li>Fourth Item</li>
        </ul>
    </div>
</body>
</html>

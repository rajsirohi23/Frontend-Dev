<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embed External Website</title>
</head>
<body>
    <h1>Embedding an External Website</h1>
    
    
    <iframe 
        src="https://www.wikipedia.org" 
        width="80%" 
        height="500" 
        title="Wikipedia"
        style="border:2px solid #333;"
        loading="lazy">
    </iframe>
    
    <p>Some websites may not allow embedding for security reasons.</p>
</body>
</html>

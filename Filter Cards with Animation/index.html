<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards with Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card-container">
    <div class="card">
        <img src="img1.jpg" alt="Profile 1">
        <h2>John Doe</h2>
        <p>Web Developer</p>
    </div>

    <div class="card">
        <img src="img2.jpg" alt="Profile 2">
        <h2>Maria Smith</h2>
        <p>Graphic Designer</p>
    </div>

    <div class="card">
        <img src="img3.jpg" alt="Profile 3">
        <h2>Alex Carter</h2>
        <p>UI/UX Designer</p>
    </div>
</div>

</body>
</html>

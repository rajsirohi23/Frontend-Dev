<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Exploration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>CSS Box Model Exploration</h1>

    <div class="container">
        <div class="box default-box">
            <div class="inner-content">Default Box (content-box)</div>
        </div>

        <div class="box border-box">
            <div class="inner-content">Box with box-sizing: border-box;</div>
        </div>
    </div>

    <div class="description">
        <p><strong>Content:</strong> The actual text or elements inside the box.</p>
        <p><strong>Padding:</strong> Space between content and border.</p>
        <p><strong>Border:</strong> The visible line around padding and content.</p>
        <p><strong>Margin:</strong> Space outside the border separating elements.</p>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .pricing-card {
            transition: 0.3s;
        }
        .pricing-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 0 30px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body class="bg-light">

    <div class="container my-5">

        <h2 class="text-center mb-4 fw-bold">Choose Your Plan</h2>

        <div class="row g-4">

            <div class="col-md-4">
                <div class="card pricing-card shadow-sm p-3">
                    <h4 class="text-center">Basic</h4>
                    <h2 class="text-center">$9/mo</h2>
                    <ul class="list-group mb-3">
                        <li class="list-group-item">1 Project</li>
                        <li class="list-group-item">Email Support</li>
                        <li class="list-group-item">Basic Features</li>
                    </ul>
                    <button class="btn btn-outline-primary w-100">Select</button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card pricing-card shadow-sm p-3 bg-primary text-white">
                    <h4 class="text-center">Pro</h4>
                    <h2 class="text-center">$19/mo</h2>
                    <ul class="list-group mb-3">
                        <li class="list-group-item">5 Projects</li>
                        <li class="list-group-item">Priority Support</li>
                        <li class="list-group-item">Advanced Features</li>
                    </ul>
                    <button class="btn btn-light w-100">Select</button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card pricing-card shadow-sm p-3">
                    <h4 class="text-center">Premium</h4>
                    <h2 class="text-center">$29/mo</h2>
                    <ul class="list-group mb-3">
                        <li class="list-group-item">Unlimited Projects</li>
                        <li class="list-group-item">24/7 Support</li>
                        <li class="list-group-item">All Features</li>
                    </ul>
                    <button class="btn btn-outline-primary w-100">Select</button>
                </div>
            </div>

        </div>
    </div>

</body>
</html>

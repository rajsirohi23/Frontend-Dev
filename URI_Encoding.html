<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URI Encoding Example</title>
</head>
<body>
    <h1>URI Encoding Demonstration</h1>
    
    <p>
        Here is a hyperlink with special characters in the URL:
    </p>
    
    
    <a href="https://example.com/search?query=HTML%20%26%20CSS" target="_blank">
        Search for "HTML & CSS"
    </a>
    
    <p>
        Explanation: Spaces are replaced with <strong>%20</strong> and the ampersand <strong>&</strong> is encoded as <strong>%26</strong> to ensure the URL works properly.
    </p>
</body>
</html>

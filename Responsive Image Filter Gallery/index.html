<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Responsive Image Filter Gallery</h1>

    <div class="gallery">

        <figure>
            <img src="img1.jpg" alt="Image 1" class="blur">
            <figcaption>Blur Filter</figcaption>
        </figure>

        <figure>
            <img src="img2.jpg" alt="Image 2" class="grayscale">
            <figcaption>Grayscale Filter</figcaption>
        </figure>

        <figure>
            <img src="img3.jpg" alt="Image 3" class="sepia">
            <figcaption>Sepia Filter</figcaption>
        </figure>

        <figure>
            <img src="img4.jpg" alt="Image 4" class="brightness">
            <figcaption>Brightness Filter</figcaption>
        </figure>

        <figure>
            <img src="img5.jpg" alt="Image 5" class="contrast">
            <figcaption>Contrast Filter</figcaption>
        </figure>

        <figure>
            <img src="img6.jpg" alt="Image 6" class="hue">
            <figcaption>Hue-Rotate Filter</figcaption>
        </figure>

    </div>

</body>
</html>

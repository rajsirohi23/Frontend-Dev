<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1 class="title">Before & After Filter Comparison</h1>

<div class="comparison-container">

    <div class="box">
        <img src="before.jpg" alt="Before Image">
        <p class="caption">Before</p>
    </div>

    <div class="box">
        <img src="after.jpg" alt="After Image" class="filtered">
        <p class="caption">After (with Filter)</p>
    </div>

</div>

</body>
</html>

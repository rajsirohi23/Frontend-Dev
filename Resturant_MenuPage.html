<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">

        <h1 class="text-center mb-3">Today's Menu</h1>
        <p class="lead text-center mb-4">Delicious meals freshly prepared for you</p>

        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>Dish</th>
                    <th>Category</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Margherita Pizza</td>
                    <td>Main Course</td>
                    <td>$12</td>
                </tr>
                <tr>
                    <td>Caesar Salad</td>
                    <td>Starter</td>
                    <td>$7</td>
                </tr>
                <tr>
                    <td>Chocolate Brownie</td>
                    <td>Dessert</td>
                    <td>$5</td>
                </tr>
                <tr>
                    <td>Lemonade</td>
                    <td>Beverage</td>
                    <td>$3</td>
                </tr>
            </tbody>
        </table>

        <h3 class="mt-5 mb-3">Chef's Specials</h3>
        <ul class="list-group mb-4">
            <li class="list-group-item">Truffle Pasta</li>
            <li class="list-group-item">Smoked BBQ Chicken</li>
            <li class="list-group-item">Seafood Platter</li>
        </ul>

        <div class="text-center">
          
            <p class="lead">Freshly served gourmet dishes</p>
        </div>

    </div>
</body>
</html>

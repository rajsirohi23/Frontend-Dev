<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tooltip Demonstration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="tooltip">HTML
      <span class="tooltiptext">HyperText Markup Language</span>
    </div>
    <div class="tooltip">CSS
      <span class="tooltiptext">Cascading Style Sheets</span>
    </div>
    <div class="tooltip">JS
      <span class="tooltiptext">JavaScript Programming Language</span>
    </div>
    <div class="tooltip">AI
      <span class="tooltiptext">Artificial Intelligence</span>
    </div>
    <div class="tooltip">DB
      <span class="tooltiptext">Database System</span>
    </div>
  </div>
</body>
</html>

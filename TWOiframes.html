<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Iframes Example</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px; 
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        iframe {
            width: 80%;     
            height: 400px;  
            border: 2px solid #333;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>My Pages</h1>

    
    <iframe 
        src="introduction.html" 
        title="Introduction Page">
    </iframe>

    
    <iframe 
        src="hobby.html" 
        title="Hobby Page">
    </iframe>
</body>
</html>

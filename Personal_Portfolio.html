<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta-name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .profile-img {
            width: 160px;
            height: 160px;
            object-fit: cover;
        }
        body{
            background-image: url("");
        }
    </style>
</head>
<body class="bg-light text-dark">

    <div class="container text-center mt-4 p-5">
        <h1 class="fw-bold">Your Name</h1>
        <p class="mb-3">Frontend Developer | Web Designer</p>

        <img src="https://via.placeholder.com/160" class="img-fluid rounded-circle profile-img mb-3" alt="Profile">

        <div class="mb-4">
            <button class="btn btn-primary me-2">Hire Me</button>
            <button class="btn btn-secondary">Download CV</button>
        </div>

        <div class="mx-auto" style="max-width: 400px;">
            <input type="text" class="form-control mb-3" placeholder="Your Name">
            <input type="email" class="form-control mb-3" placeholder="Your Email">
            <textarea class="form-control mb-3" rows="3" placeholder="Message"></textarea>
            <button class="btn btn-dark w-100">Send Message</button>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Layout</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f5f7;
      height: 100vh;
      display: grid;
      grid-template-columns: 1fr 4fr;
      grid-template-rows: auto 1fr;
      grid-template-areas:
        "header header"
        "sidebar main";
      gap: 20px;
      padding: 20px;
    }

    header {
      grid-area: header;
      background-color: #2c3e50;
      color: white;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 10px;
    }

    header span {
      font-size: 18px;
      color: #bdc3c7;
    }

    aside {
      grid-area: sidebar;
      background-color: #34495e;
      color: white;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    aside h3 {
      margin-bottom: 20px;
      text-align: center;
      letter-spacing: 1px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 10px 0;
      padding: 10px;
      border-radius: 5px;
      transition: background 0.3s;
    }

    nav a:hover {
      background-color: #2c3e50;
    }

    main {
      grid-area: main;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 200px);
      gap: 20px;
    }

    .box {
      background-color: white;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      font-weight: 500;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .box:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
    }

    .wide {
      grid-column: span 2;
      background-color: #e3f2fd;
    }

    @media (max-width: 900px) {
      body {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto 1fr;
        grid-template-areas:
          "header"
          "sidebar"
          "main";
      }

      main {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(4, 200px);
      }

      .wide {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>
  <header>
    Dashboard Overview
    <span>Welcome, Raj</span>
  </header>


  <aside>
    <h3>Navigation</h3>
    <nav>
      <a href="#">Home</a>
      <a href="#">Analytics</a>
      <a href="#">Reports</a>
      <a href="#">Settings</a>
    </nav>
  </aside>

  <main>
    <div class="box">Statistics</div>
    <div class="box">Revenue</div>
    <div class="box wide">User Insights (spans 2 columns)</div>
    <div class="box">Notifications</div>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Section</title>
  <style>
    /* --- Global Reset --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* --- Pricing Section --- */
    .pricing-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      flex-wrap: wrap;
      padding: 40px;
      animation: fadeIn 1s ease-in-out;
    }

    /* --- Card Base --- */
    .card {
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 280px;
      padding: 30px;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: fadeIn 1.2s ease-in-out;
    }

    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    /* --- Highlighted Middle Card --- */
    .card.featured {
      background-color: #007bff;
      color: white;
      transform: scale(1.05);
    }

    /* --- Card Content --- */
    .card h2 {
      margin-bottom: 15px;
      font-size: 22px;
    }

    .card p.price {
      font-size: 32px;
      font-weight: bold;
      margin: 15px 0;
    }

    .card ul {
      list-style: none;
      margin: 20px 0;
    }

    .card ul li {
      margin: 10px 0;
      color: #555;
    }

    .card.featured ul li {
      color: #f1f1f1;
    }

    .card button {
      padding: 10px 25px;
      border: none;
      background-color: #333;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s;
    }

    .card.featured button {
      background-color: white;
      color: #007bff;
      font-weight: bold;
    }

    .card button:hover {
      background-color: #555;
    }

    /* --- Fade-In Animation --- */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* --- Responsive Design --- */
    @media (max-width: 750px) {
      .pricing-container {
        flex-direction: column;
        gap: 20px;
      }

      .card {
        width: 80%;
        transform: none;
      }

      .card.featured {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="pricing-container">
    <!-- Basic Plan -->
    <div class="card">
      <h2>Basic</h2>
      <p class="price">$19/month</p>
      <ul>
        <li>✔ 5 Projects</li>
        <li>✔ Basic Analytics</li>
        <li>✖ Premium Support</li>
      </ul>
      <button>Choose Plan</button>
    </div>

    <!-- Featured Plan -->
    <div class="card featured">
      <h2>Pro</h2>
      <p class="price">$49/month</p>
      <ul>
        <li>✔ 20 Projects</li>
        <li>✔ Advanced Analytics</li>
        <li>✔ Priority Support</li>
      </ul>
      <button>Get Started</button>
    </div>

    <!-- Premium Plan -->
    <div class="card">
      <h2>Enterprise</h2>
      <p class="price">$99/month</p>
      <ul>
        <li>✔ Unlimited Projects</li>
        <li>✔ Full Analytics</li>
        <li>✔ 24/7 Support</li>
      </ul>
      <button>Contact Us</button>
    </div>
  </div>
</body>
</html>

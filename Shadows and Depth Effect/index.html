<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and Depth Effect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Shadows and Depth Effect Layout</h2>
    <div class="card-container">
        <div class="card card1">
            <h3>Profile One</h3>
            <p>This card has a soft shadow for subtle depth.</p>
        </div>
        <div class="card card2">
            <h3>Profile Two</h3>
            <p>This card uses a medium shadow for a raised effect.</p>
        </div>
        <div class="card card3">
            <h3>Profile Three</h3>
            <p>This card features a deeper shadow for stronger emphasis.</p>
        </div>
    </div>
</body>
</html>

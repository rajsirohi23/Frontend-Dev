<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">

        <div class="card p-4 shadow-sm">

            <h2 class="mb-3">User Notifications</h2>

            <div class="alert alert-success mb-3">
                New message received successfully.
            </div>

            <div class="alert alert-info mb-3">
                Tip: Update your profile for better recommendations.
            </div>

            <div class="alert alert-danger mb-3">
                Warning: Your account storage is almost full.
            </div>

            <div class="alert alert-warning alert-dismissible fade show mb-3">
                This is a dismissible notification.
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="bg-white border p-4 rounded">
                <h5>Summary</h5>
                <p class="mb-0">You have 3 unread messages and 1 active warning. Stay updated with your alerts.</p>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
